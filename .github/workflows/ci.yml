name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, test, BDD)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [go.mod, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        if: matrix.go == 'go.mod'
        with:
          go-version-file: go.mod
      - uses: actions/setup-go@v5
        if: matrix.go == 'stable'
        with:
          go-version: stable
      - run: go mod verify
      - run: go vet ./...
      - name: golangci-lint (includes gosec)
        if: matrix.go == 'go.mod'
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
      - name: Unit tests (race + coverage)
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage gate (internal/ >= 80%)
        run: |
          go tool cover -func=coverage.out | tail -n 1
          go test -count=1 -cover ./internal/... | tee cover.txt
          awk '/coverage:/ { v=$5; sub("%","",v); if (v+0 < 80) { print "below 80%: " $2 " " $5; bad=1 } } END { exit bad }' cover.txt
      - name: API BDD (godog)
        run: go test -count=1 -v ./test/bdd/...
      - name: Probe latency under load (NFR-PERF-001, isolated, no -race)
        run: go test -tags perf -count=1 -v -run 'UnderLoad' ./internal/server/

  go-security:
    name: Go security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # NFR-SEC-015 AC2: exact version, verified by go.sum/sumdb. v1.9.0 needs Go 1.26,
      # which the go command fetches (sumdb-verified) because GOTOOLCHAIN is auto. Set it
      # explicitly (NFR-MAINT-007 AC6): setup-go v6+ exports GOTOOLCHAIN=local.
      - name: govulncheck
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # NFR-SEC-015 AC1/AC4: pinned release, SHA-256 committed here, verified before
      # extraction. shellcheck is preinstalled on ubuntu-latest and actionlint uses it.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          scripts/fetch-verified.sh "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 actionlint.tar.gz
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  web:
    name: Web (lint, typecheck, test, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - name: Toolchain pins consistent (NFR-MAINT-007)
        run: ./scripts/check-toolchain.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm -r run lint
      - run: pnpm -r run typecheck
      - run: pnpm --filter web run test
      - run: pnpm --filter web run build
      - name: Bundle-size budget (NFR-PERF-004)
        run: pnpm --filter web run size
      # NFR-SEC-010 AC1/AC2: production deps fail on any advisory,
      # everything (dev tooling included) fails on moderate or above.
      - name: pnpm audit (production deps, low+)
        run: pnpm audit --prod --audit-level low
      - name: pnpm audit (all deps, moderate+)
        run: pnpm audit --audit-level moderate
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  e2e:
    name: UI BDD (playwright-bdd + axe)
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: make build-go
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm --filter e2e run test
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        # NFR-SEC-015 AC1: pinned release, SHA-256 committed here; the helper writes the file only after it matches.
        run: |
          scripts/fetch-verified.sh https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  image:
    name: Container image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: dv:ci
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
