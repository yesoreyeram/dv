# Dependency updates (NFR-SEC-014, NFR-MAINT-008). Batched so PRs do not pile up; green
# PRs are merged by .github/workflows/automerge.yml. Renovate (renovate.json) covers only
# mise.toml, which Dependabot cannot read, so no dependency gets two update PRs.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    groups:
      web-dev:
        dependency-type: development
        update-types: [minor, patch]
      web-prod:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, docker]
    ignore:
      # Odd Node majors never become LTS (NFR-MAINT-007); even majors are proposed.
      - dependency-name: node
        versions: ["23", "23.x", "25", "25.x", "27", "27.x", "29", "29.x"]
